<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>天亮之前</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root { --paper: #ebe6da; --ink: #26231f; --mid: #8a837a; --acc: #9b2b1f; --btn: #f4f0e6; --btnInk: #26231f; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { font-family: "Noto Serif TC", "Songti TC", serif; color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; }
  #ctl[hidden] { display: none !important; }
  #ctl { position: fixed; left: 0; right: 0; bottom: 0; height: 150px; padding: 0 14px calc(10px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px; pointer-events: none; }
  .b { pointer-events: auto; border: 3px solid var(--btnInk); background: var(--btn); color: var(--btnInk); font: 900 22px "Noto Serif TC", serif; border-radius: 2px; height: 96px; display: grid; place-items: center; box-shadow: 4px 4px 0 var(--btnInk); -webkit-tap-highlight-color: transparent; padding: 0; }
  .b:active, .b.on { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--btnInk); }
  #bL, #bR { width: 92px; font-size: 40px; }
  #bAct { flex: 1; font-size: 26px; line-height: 1.15; }
  #bAct.off { opacity: 0.25; }
  #bAct small { display: block; font-size: 15px; font-weight: 600; }
  #card { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,0.0); }
  #card[hidden] { display: none; }
  #card.low { align-items: end; padding-bottom: calc(14px + env(safe-area-inset-bottom)); } /* 兩難時卡片放下面，看得到三樓的房間 */
  .sheet { width: min(88vw, 420px); background: var(--paper); border: 3px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); padding: 22px 22px 18px; }
  .sheet h1 { margin: 0 0 6px; font-size: 32px; font-weight: 900; letter-spacing: 2px; }
  .sheet h2 { margin: 0 0 12px; font-size: 18px; font-weight: 600; color: var(--mid); }
  .sheet p { margin: 0 0 12px; font-size: 20px; line-height: 1.6; font-weight: 600; }
  .sheet .q { color: var(--acc); font-weight: 900; }
  .sheet .row { display: grid; gap: 12px; margin-top: 14px; }
  .sheet .row.two { grid-template-columns: 1fr 1fr; }
  .sheet button { pointer-events: auto; border: 3px solid var(--ink); background: var(--btn); color: var(--ink); font: 900 21px "Noto Serif TC", serif; padding: 14px 6px; box-shadow: 4px 4px 0 var(--ink); border-radius: 2px; line-height: 1.3; }
  .sheet button small { display: block; font-size: 14px; font-weight: 600; color: var(--mid); }
  .sheet button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .sheet .timer { height: 8px; background: var(--ink); margin: 6px 0 4px; transform-origin: left; }
  .sheet .note { font-size: 15px; color: var(--mid); font-weight: 600; margin-top: 14px; }
  #toast { position: fixed; left: 50%; top: 92px; transform: translateX(-50%); font: 900 22px "Noto Serif TC", serif; padding: 8px 16px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); white-space: nowrap; transition: opacity .3s; opacity: 0; pointer-events: none; }
  /* 樣式二：褪色照片 */
  body.s2 { --paper: #d9d1c2; --ink: #16181b; --mid: #6d6a63; --acc: #a33a2a; --btn: #e3dccd; background: #101215; }
  /* 樣式三：版畫 */
  body.s3 { --paper: #efe6d0; --ink: #141210; --mid: #5a524a; --acc: #b3261e; --btn: #efe6d0; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ctl" hidden><button class="b" id="bL">◀</button><button class="b" id="bR">▶</button><button class="b off" id="bAct">　</button></div>
<div id="toast"></div>
<div id="card"></div>
<script>
'use strict';
/* =========================================================
   天亮之前（樣品：一個晚上）
   港灣市被圍第 37 天。你和發燒的妹妹躲在家裡；今晚要摸黑到對面的公寓找藥。
   白天：決定最後一個罐頭給誰。夜晚：在公寓剖面裡左右走、上下樓、搜櫃子，
   避開巡邏兵的手電筒與外面的探照燈；四樓老夫婦的桌上有藥。天亮前回家。
   ========================================================= */
const Q = new URLSearchParams(location.search);
const STYLE = +(Q.get('s') || 2); document.body.classList.add('s' + STYLE);
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
let W = 0, H = 0, DPR = 1;
const L = { top: 70, bot: 158, bx: 0, by: 0, bw: 0, bh: 0, fh: 0, u: 0 };
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const side = 10; L.bw = Math.min(W - side * 2, 520); L.bx = (W - L.bw) / 2; L.by = L.top + 8; L.bh = H - L.top - L.bot - 14; L.fh = L.bh / 5; L.u = L.bw / 10;
  makeHatch(); ST = null;
}
addEventListener('resize', resize);

/* ---------- 樣式（三種：炭筆素描、褪色照片、版畫） ---------- */
const PAL = {
  1: { sky: '#cfc9bc', wall: '#ddd6c8', wallD: '#bdb5a6', floor: '#5a544c', ink: '#26231f', mid: '#8a837a', furn: '#a59c8c', dark: 'rgba(30,27,24,0.80)', lite: '#fff7dc', acc: '#9b2b1f', moon: '#f4f1e8' },
  2: { sky: '#1b2230', wall: '#4a4c50', wallD: '#36383c', floor: '#202224', ink: '#0c0d0f', mid: '#6d6a63', furn: '#5b554c', dark: 'rgba(4,6,10,0.86)', lite: '#ffd89a', acc: '#c0483a', moon: '#a9bcd8' },
  3: { sky: '#efe6d0', wall: '#efe6d0', wallD: '#d8ccb0', floor: '#141210', ink: '#141210', mid: '#5a524a', furn: '#141210', dark: 'rgba(20,18,16,1)', lite: '#efe6d0', acc: '#b3261e', moon: '#efe6d0' },
}[STYLE] || null;
let HATCH = null;
function makeHatch() { // 炭筆的交叉排線（暗處用）
  const c = document.createElement('canvas'); c.width = c.height = 48; const h = c.getContext('2d');
  if (STYLE === 1) { h.strokeStyle = 'rgba(38,35,31,0.9)'; h.lineWidth = 1.3; for (let i = -48; i < 96; i += 5) { h.beginPath(); h.moveTo(i, 0); h.lineTo(i + 48, 48); h.stroke(); } h.lineWidth = 0.9; for (let i = -48; i < 96; i += 7) { h.beginPath(); h.moveTo(i + 48, 0); h.lineTo(i, 48); h.stroke(); } }
  else if (STYLE === 2) { const d = h.createImageData(48, 48); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 40; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 225; } h.putImageData(d, 0, 0); }
  else { h.fillStyle = '#141210'; h.fillRect(0, 0, 48, 48); }
  HATCH = g.createPattern(c, 'repeat');
}
// 手繪感：線條稍微抖動（素描樣式）
function rough(x1, y1, x2, y2, col, w = 2) {
  g.strokeStyle = col; g.lineWidth = w; g.beginPath();
  if (STYLE === 1) { const n = Math.max(2, Math.round(Math.hypot(x2 - x1, y2 - y1) / 18)); g.moveTo(x1 + jit(), y1 + jit()); for (let i = 1; i <= n; i++) { const t = i / n; g.lineTo(lerp(x1, x2, t) + jit(), lerp(y1, y2, t) + jit()); } }
  else { g.moveTo(x1, y1); g.lineTo(x2, y2); }
  g.stroke();
}
let SEED = 1; const srnd = () => { SEED = (SEED * 16807) % 2147483647; return SEED / 2147483647; };
const jit = () => (srnd() - 0.5) * 1.6;

/* ---------- 世界（單位：寬 0～10，樓層 0＝一樓 … 4＝五樓） ---------- */
const STAIRS = [{ f: 0, x: 8.6 }, { f: 1, x: 1.4 }, { f: 2, x: 8.6 }, { f: 3, x: 1.4 }]; // 每一段樓梯連接 f 與 f+1
const EXIT = { f: 0, x: 0.55 };
const HIDES = [{ f: 2, x: 3.3, n: '門後', k: 'door' }, { f: 2, x: 6.9, n: '窗簾後', k: 'curtain' }, { f: 4, x: 2.6, n: '衣櫃旁', k: 'none' }, { f: 4, x: 6.1, n: '倒下的櫃子後', k: 'tipped' }, { f: 1, x: 5.0, n: '門後', k: 'door' }];
const BOXES = [
  { f: 0, x: 3.9, n: '翻倒的櫃子', loot: ['繃帶'], k: 'cabinetDown' },
  { f: 0, x: 6.4, n: '紙箱', loot: [], k: 'carton' },
  { f: 1, x: 3.2, n: '廚房櫃', loot: ['罐頭'], k: 'kitchen' },
  { f: 1, x: 6.6, n: '衣櫃', loot: ['木柴'], k: 'wardrobe' },
  { f: 2, x: 5.2, n: '士兵的背包', loot: ['藥', '罐頭'], k: 'pack' },
  { f: 2, x: 2.0, n: '五斗櫃', loot: [], k: 'drawers' },
  { f: 3, x: 3.0, n: '書櫃', loot: ['木柴'], k: 'books' },
  { f: 3, x: 6.5, n: '桌上的藥盒', loot: ['藥'], couple: true, k: 'table' },
  { f: 4, x: 4.3, n: '冰箱', loot: ['罐頭', '罐頭'], k: 'fridge' },
  { f: 4, x: 7.6, n: '床底', loot: ['繃帶'], k: 'bed' },
];
const ROOM_WALLS = [ // 房間隔間（裝飾用，不擋路）
  { f: 0, x: 2.6 }, { f: 0, x: 7.4 }, { f: 1, x: 4.8 }, { f: 2, x: 4.0 }, { f: 3, x: 4.6 }, { f: 4, x: 5.5 },
];
const HOLES = [ // 牆上的破洞（月光照進來）
  { f: 4, x0: 8.2, x1: 10, top: true }, { f: 3, x0: 0, x1: 0.9 }, { f: 1, x0: 9.1, x1: 10 }, { f: 2, x0: 0, x1: 0.6 },
];
const WINDOWS = [{ f: 4, x: 1.5 }, { f: 4, x: 3.2 }, { f: 4, x: 6.9 }, { f: 3, x: 2.0, board: 1 }, { f: 3, x: 8.2 }, { f: 2, x: 6.9, curtain: 1 }, { f: 2, x: 1.0 }, { f: 1, x: 2.0 }, { f: 1, x: 7.8, board: 1 }, { f: 0, x: 5.3, board: 1 }];
const DECOR = [ // 其他陳設（只有畫面）
  { f: 4, k: 'rubble', x: 8.9, w: 2.0 }, { f: 4, k: 'wardrobe2', x: 2.0 }, { f: 3, k: 'bed2', x: 8.25 }, { f: 3, k: 'chair', x: 5.9 }, { f: 3, k: 'frame', x: 7.2 }, { f: 3, k: 'frame', x: 3.9 }, { f: 2, k: 'rubble', x: 0.6, w: 1.1 }, { f: 2, k: 'chair', x: 7.9, tip: 1 }, { f: 1, k: 'rubble', x: 9.4, w: 1.2 }, { f: 1, k: 'table2', x: 1.2 }, { f: 1, k: 'frame', x: 4.0 }, { f: 0, k: 'mail', x: 2.0 }, { f: 0, k: 'rubble', x: 8.0, w: 1.0 }, { f: 4, k: 'bulb', x: 5.2 }, { f: 2, k: 'bulb', x: 4.6 }, { f: 1, k: 'bulb', x: 6.0 },
];

const S = {
  phase: 'title', t: 0, night: 110, dawn: 110, ate: false,
  p: { f: 0, x: 0.9, vx: 0, face: 1, hide: false, climb: 0, climbTo: 0, search: null, sk: 0, walk: 0 },
  bag: [], cap: 4, caught: false, tookCouple: null, home: false,
  sol: { f: 2, x: 8.8, dir: -1, mode: 'patrol', wait: 0, tx: 0, look: 0, alert: 0 },
  beam: { t: 0 }, spot: 0, spotBy: '', boxes: BOXES.map((b) => ({ ...b, done: false })),
};
const IN = { l: false, r: false };

/* ---------- 聲音（輕柔：腳步、翻找、心跳、風；沒有爆炸聲） ---------- */
const AU = { ctx: null, noise: null, wind: null, hbT: 0 };
function audioInit() {
  if (AU.ctx) { AU.ctx.resume(); return; }
  try { AU.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { return; }
  const c = AU.ctx; const buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; AU.noise = buf;
  const src = c.createBufferSource(); src.buffer = buf; src.loop = true; const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380; const gn = c.createGain(); gn.gain.value = 0.05; src.connect(f).connect(gn).connect(c.destination); src.start(); AU.wind = gn;
}
function tick(freq, len, vol, type = 'bandpass') { const c = AU.ctx; if (!c) return; const s = c.createBufferSource(); s.buffer = AU.noise; const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = 1.2; const gn = c.createGain(); const t = c.currentTime; gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + len); s.connect(f).connect(gn).connect(c.destination); s.start(t, Math.random()); s.stop(t + len + 0.02); }
function thump(vol) { const c = AU.ctx; if (!c) return; const o = c.createOscillator(); o.frequency.value = 52; const gn = c.createGain(); const t = c.currentTime; gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.02); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.22); o.connect(gn).connect(c.destination); o.start(t); o.stop(t + 0.25); }

/* ---------- 卡片（白天、兩難、早上） ---------- */
function card(html, binds = {}, low = false) { const c = $('card'); c.classList.toggle('low', low); c.innerHTML = `<div class="sheet">${html}</div>`; c.hidden = false; for (const k in binds) { const b = c.querySelector(`[data-k="${k}"]`); if (b) b.onclick = () => { audioInit(); binds[k](); }; } }
function hideCard() { $('card').hidden = true; $('card').innerHTML = ''; }
function toast(t, ms = 1500) { const el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(el._t); el._t = setTimeout(() => (el.style.opacity = 0), ms); }

function title() {
  S.phase = 'title';
  card(`<h1>天亮之前</h1><h2>港灣市被圍的第 37 天</h2>
    <p>城裡斷水斷電已經一個多月。你和十歲的妹妹小玥躲在家裡。</p>
    <p>小玥昨晚開始發燒。</p>
    <div class="row"><button data-k="go">開始<small>樣品：一個白天＋一個晚上，約 3 分鐘</small></button></div>`, { go: day });
}
function day() {
  S.phase = 'day';
  card(`<h1>白天</h1><h2>白天街上有狙擊手，不能出門</h2>
    <p>小玥燒到 39 度，額頭燙手。家裡只剩<b>最後一個罐頭</b>。</p>
    <p class="q">這個罐頭給誰吃？</p>
    <div class="row two"><button data-k="sis">給妹妹<small>她需要體力撐過發燒</small></button><button data-k="me">自己吃<small>今晚翻找東西比較快</small></button></div>`,
    { sis: () => { S.ate = false; plan(); }, me: () => { S.ate = true; plan(); } });
}
function plan() {
  card(`<h1>入夜</h1><h2>天亮之前一定要回到家</h2>
    <p>對面那棟被砲擊過的公寓，聽說還有人沒搬走，也有東西沒被搜走。</p>
    <p class="q">今晚的目標：找到退燒藥。</p>
    <p style="font-size:17px">◀ ▶ 左右走；靠近樓梯、櫃子、能躲的地方時，右邊的按鈕會變成「上樓／下樓」「搜」「躲」。<br>巡邏兵的手電筒和外面的探照燈照到你，就會被發現。</p>
    <div class="row"><button data-k="go">出門</button></div>`, { go: startNight });
}
function startNight() { hideCard(); S.phase = 'night'; S.t = 0; $('ctl').hidden = false; toast('天亮前要回到一樓的門口', 2200); }

let DLG = null; // 四樓老夫婦的兩難：限時 8 秒
function coupleDilemma(box) {
  S.phase = 'dlg'; DLG = { t: 8, box };
  card(`<h1 style="font-size:26px">四樓・老夫婦的房間</h1>
    <p>燭光下，床上的老先生在喘氣。你剛拿起桌上的藥盒，老太太就醒了。</p>
    <p class="q">「那是他的心臟藥……只剩這一盒了。拜託。」</p>
    <div class="timer" id="dTimer"></div>
    <div class="row two"><button data-k="take">拿走<small>小玥需要藥</small></button><button data-k="leave">放回去<small>再去別的地方找</small></button></div>`,
    { take: () => endDlg(true), leave: () => endDlg(false) }, true);
}
function endDlg(take) {
  if (!DLG) return; const box = DLG.box; DLG = null; hideCard(); S.phase = 'night';
  S.tookCouple = !!take; box.done = true;
  if (take) { addLoot('藥'); toast('你把藥盒塞進背包，沒有回頭', 2200); }
  else toast(take === false ? '你把藥盒放回桌上' : '你遲疑了，把藥盒放回桌上', 2000);
}
function addLoot(it) { if (S.bag.length >= S.cap) { toast('背包滿了'); return false; } S.bag.push(it); return true; }

function caught(by) {
  S.caught = true; S.phase = 'end'; S.lost = S.bag.length; S.bag = []; $('ctl').hidden = true; S.spotBy = by;
  setTimeout(morning, 1400); toast(by === 'beam' ? '探照燈照到你了！' : '巡邏兵：「站住！」', 1400);
}
function goHome() { S.home = true; S.phase = 'end'; $('ctl').hidden = true; morning(); }
function morning() {
  const med = S.bag.includes('藥'), food = S.bag.filter((x) => x === '罐頭').length;
  const lines = [];
  if (S.caught) lines.push(`<p>${S.spotBy === 'beam' ? '外面的探照燈掃到你。' : '巡邏兵的手電筒照到你。'}你丟下背包，拚命跑回家，什麼都沒帶回來。</p>`);
  else if (!S.home) lines.push('<p>天亮了。你只能躲在對面的公寓，等到天黑才敢回家，小玥多等了一整天。</p>');
  else lines.push(`<p>天亮前，你回到家。背包裡：${S.bag.length ? S.bag.join('、') : '什麼也沒有'}。</p>`);
  lines.push(med && !S.caught ? '<p>小玥吃了藥。中午，她的燒退了一點，說想喝水。</p>' : `<p>小玥燒到 40 度，整個早上都在說胡話。${S.ate ? '' : '昨天那個罐頭，她只吃了兩口。'}</p>`);
  if (S.ate) lines.push('<p>昨天最後一個罐頭是你吃的。小玥已經一整天沒吃東西。</p>');
  if (!S.caught && food) lines.push(`<p>多了 ${food} 個罐頭，你們可以再撐幾天。</p>`);
  if (S.tookCouple === true) lines.push('<p class="q">對面四樓那扇窗，之後再也沒有亮過燭光。</p>');
  else if (S.tookCouple === false) lines.push('<p>對面四樓那扇窗，今天晚上還亮著燭光。</p>');
  card(`<h1>早上</h1><h2>被圍的第 38 天</h2>${lines.join('')}
    <p class="note">樣品到這裡結束。完整版預計三天三夜；最後揭露全班的選擇（例如：全班有幾人拿走了老夫婦的藥）。</p>
    <div class="row"><button data-k="again">再玩一次</button></div>`, { again: () => location.reload() });
}

/* ---------- 遊戲邏輯 ---------- */
const near = (f, x, r) => S.p.f === f && Math.abs(S.p.x - x) < r;
function context() { // 右邊按鈕現在能做什麼
  const p = S.p; if (p.climb > 0 || p.search) return null;
  if (p.hide) return { k: 'unhide', t: '出來' };
  if (near(EXIT.f, EXIT.x, 0.5)) return { k: 'home', t: '回家', s: S.bag.length ? `帶著 ${S.bag.length} 樣東西` : '空手' };
