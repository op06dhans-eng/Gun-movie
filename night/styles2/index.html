<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>漫畫風格樣張</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --ink: #141414; --bg: #e9e4d8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans TC", sans-serif; }
  header { padding: 22px 16px 6px; max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 900; margin: 0 0 6px; }
  header p { font-size: 18px; font-weight: 700; line-height: 1.6; margin: 4px 0; }
  h2 { max-width: 1180px; margin: 26px auto 8px; padding: 0 16px; font-size: 24px; font-weight: 900; }
  .grid { max-width: 1180px; margin: 0 auto; padding: 0 16px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 22px; }
  .card { background: #fff; border: 3px solid var(--ink); }
  .meta { padding: 12px 14px 14px; border-top: 3px solid var(--ink); }
  .meta b { display: block; font-size: 22px; font-weight: 900; }

  .meta .num { display: inline-block; background: var(--ink); color: #fff; padding: 0 8px; margin: 0 8px 0 0; font-size: 22px; line-height: 1.4; }
  .meta .why { display: block; font-size: 17px; font-weight: 700; line-height: 1.55; margin-top: 4px; color: #333; }
  /* 漫畫頁 */
  .page { position: relative; padding: 10px; display: grid; gap: 10px; }
  .pn { position: relative; overflow: hidden; }
  .pn img { display: block; width: 100%; }
  .p1 img { aspect-ratio: 5 / 4; object-fit: cover; object-position: 50% 62%; }
  .cap { position: absolute; font-weight: 900; font-size: 17px; line-height: 1.5; padding: 6px 10px; max-width: 88%; }
  .say { position: absolute; font-weight: 900; font-size: 17px; line-height: 1.45; padding: 10px 18px; text-align: center; }
  .c1 { left: 6px; top: 6px; } .c2 { right: 6px; top: 34%; } .c3 { left: 6px; bottom: 6px; } .c4 { left: 6px; top: 6px; } .c5 { right: 6px; bottom: 6px; }
  /* 各風格的字框 */
  .manga .page { background: #fff; } .manga .pn { border: 3px solid #111; } .manga .cap { background: #fff; border: 2px solid #111; } .manga .say { background: #fff; border: 2px solid #111; border-radius: 50%; }
  .ligne .page { background: #f6f1e4; } .ligne .pn { border: 2px solid #222; } .ligne .cap { background: #fbefb8; border: 2px solid #222; font-weight: 700; } .ligne .say { background: #fff; border: 2px solid #222; border-radius: 46%; font-weight: 700; }
  .noir .page { background: #0c0c0c; } .noir .pn { border: 3px solid #f2f2f2; } .noir .cap { background: #0c0c0c; color: #f4f4f4; border-left: 8px solid #c8102e; font-family: "Noto Serif TC", serif; } .noir .say { background: #f4f4f4; border-radius: 50%; }
  .water .page { background: #f4efe6; } .water .cap { background: rgba(250, 246, 238, .9); font-family: "Noto Serif TC", serif; font-weight: 700; color: #3a3530; } .water .say { background: rgba(255, 255, 255, .92); border-radius: 50%; font-family: "Noto Serif TC", serif; font-weight: 700; }
  .wood .page { background: #e8d9b8; } .wood .pn { border: 5px solid #161210; } .wood .cap { background: #efe3c6; border: 4px solid #161210; font-family: "Noto Serif TC", serif; } .wood .say { background: #efe3c6; border: 4px solid #161210; border-radius: 40%; font-family: "Noto Serif TC", serif; }
  .hatch .page { background: #faf7ef; } .hatch .pn { border: 2px solid #111; } .hatch .cap { background: #faf7ef; border: 1.5px solid #111; font-family: "Noto Serif TC", serif; font-weight: 700; } .hatch .say { background: #fff; border: 1.5px solid #111; border-radius: 50%; font-family: "Noto Serif TC", serif; font-weight: 700; }
  .stark .page { background: #fff; } .stark .pn { border: 4px solid #000; border-radius: 6px; } .stark .cap { background: #fff; border: 3px solid #000; border-radius: 10px; } .stark .say { background: #fff; border: 3px solid #000; border-radius: 50%; }
  .bashir .page { background: #120e08; } .bashir .cap { background: transparent; color: #f2c14e; text-shadow: 0 0 6px #000, 0 0 2px #000; font-size: 18px; } .bashir .say { background: #f2c14e; color: #120e08; border-radius: 50%; }
  .riso .page { background: #f6efe7; } .riso .pn { border: 3px solid #1d3b8a; } .riso .cap { background: #ff6fa5; color: #1d3b8a; box-shadow: 4px 4px 0 #1d3b8a; } .riso .say { background: #fff; color: #1d3b8a; border: 3px solid #1d3b8a; border-radius: 50%; }
  .news .page { background: #e6dcc4; } .news .pn { border: 1px solid #555; } .news .cap { position: static; display: block; max-width: none; background: transparent; font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 16px; color: #2a2620; border-top: 1px solid #555; padding: 6px 2px 0; } .news .say { background: #f1ead8; border: 1px solid #555; font-family: "Noto Serif TC", serif; }
</style></head><body>
<header>
  <h1>背景故事漫畫：風格樣張</h1>
  <p>每一種都用同兩格畫面：爸爸出門那一晚、發燒的妹妹，字框也換成那種風格的樣子，方便比較。</p>
  <p>前 5 種是其他常見的漫畫畫風；後 5 種是我推薦參考的方向，都和「戰爭中的平民」這個題材特別合得來。選好號碼告訴我就行，也可以混搭（例如「6 的畫法＋9 的顏色」）。</p>
</header>
<h2>其他漫畫畫風</h2><div class="grid" id="g1"></div>
<h2>推薦參考的方向</h2><div class="grid" id="g2"></div>
<script>
const S = [
  ['manga', '黑白網點（日本漫畫）', '只有黑、白和灰色網點。學生最熟悉，讀起來快，情緒靠表情和留白。'],
  ['ligne', '清線派（法國、比利時圖像小說）', '均勻的細黑線、乾淨的平塗色，沒有大塊黑影。像《丁丁歷險記》那一派，冷靜、清楚，像在說一段紀錄。'],
  ['noir', '高反差黑白（黑色電影）', '只有純黑和純白，大片陰影吞掉細節。很壓迫，適合宵禁、夜裡、看不清的威脅。'],
  ['water', '水彩圖像小說', '淡彩、紙張紋理、顏料暈開的邊。最溫柔的一種，適合講家人、回憶和失去。'],
  ['wood', '木刻版畫', '黑與米黃兩色、刻刀的線條。像二十世紀初反戰版畫的語言，沉重、有紀念碑的感覺。'],
  ['hatch', '戰地紀實漫畫（鋼筆交叉排線）', '用一層一層的細鋼筆線疊出明暗，像記者到戰地畫下的報導漫畫（例如描寫波士尼亞圍城的作品）。真實、有見證的分量。'],
  ['stark', '極簡黑白剪影', '只剩黑白兩色的大色塊，沒有灰階。像《我在伊朗長大》那種回憶錄漫畫，簡單，所以更刺痛。'],
  ['bashir', '動畫紀錄片式平塗', '黑、深褐、赭黃幾個顏色，加粗外框。像以戰爭回憶為題的動畫紀錄片，夢一般、不真實的距離感。'],
  ['riso', '雙色孔版印刷', '深藍＋粉紅兩種油墨，套印微微錯開、有顆粒。像獨立出版的小誌，年輕、有手作感，學生接受度高。'],
  ['news', '褪色報紙照片', '粗網點、泛黃、還有摺痕，像一張留下來的舊剪報。讓故事讀起來像「真的發生過」的紀錄。'],
];
const T = { c1: '第 22 天。爸爸把最後半塊餅乾，塞進妹妹的手裡。', say: '我去找點吃的。<br>天亮前回來。', c3: '那天晚上，爸爸沒有回來。', c4: '她燒得迷迷糊糊，一直叫媽媽。' };
S.forEach(([k, name, why], i) => {
  const news = k === 'news';
  const card = document.createElement('div'); card.className = 'card ' + k;
  card.innerHTML = `<div class="page">
    <div class="pn">${news ? '' : `<div class="cap c1">${T.c1}</div>`}<img src="${k}_s6.jpg" alt=""><div class="say" style="right:8px;top:${news ? 8 : 26}%">${T.say}</div>${news ? '' : `<div class="cap c3">${T.c3}</div>`}</div>
    ${news ? `<div class="cap">${T.c1}<br>${T.c3}</div>` : ''}
    <div class="pn p1"><img src="${k}_s8.jpg" alt="">${news ? '' : `<div class="cap c5">${T.c4}</div>`}</div>
    ${news ? `<div class="cap">${T.c4}</div>` : ''}
  </div><div class="meta"><b><span class="num">${i + 1}</span>${name}</b><span class="why">${why}</span></div>`;
  document.getElementById(i < 5 ? 'g1' : 'g2').appendChild(card);
});
</script></body></html>
