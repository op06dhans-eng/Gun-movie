<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>背景故事新風格樣張</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1b1b1d; color: #eee; font-family: "Noto Sans TC", sans-serif; }
  header, section { max-width: 1100px; margin: 0 auto; padding: 22px 16px 4px; }
  h1 { font-size: 28px; font-weight: 900; margin: 0 0 8px; }
  h2 { font-size: 24px; font-weight: 900; margin: 30px 0 6px; }
  p.lead { font-size: 18px; font-weight: 700; line-height: 1.65; margin: 4px 0; color: #ccc; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
  .phone { width: 300px; aspect-ratio: 9 / 19.5; border-radius: 32px; border: 8px solid #000; overflow: hidden; position: relative; box-shadow: 0 10px 40px #0008; }
  .tag { text-align: center; font-size: 16px; font-weight: 700; color: #aaa; margin-top: 8px; }
  /* A 電影畫面 */
  .film { background: #000; }
  .film img { position: absolute; left: 0; top: 46%; width: 100%; height: 62%; object-fit: cover; transform: translateY(-50%) scale(1.06); animation: push 9s ease-out infinite alternate; }
  @keyframes push { to { transform: translateY(-50%) scale(1.14); } }
  .film .sub { position: absolute; left: 10px; right: 10px; bottom: 4%; text-align: center; font-size: 17px; font-weight: 700; line-height: 1.6; color: #fff; text-shadow: 0 2px 6px #000, 0 0 2px #000; }
  .film .day { position: absolute; left: 0; right: 0; top: 8%; text-align: center; font-size: 15px; letter-spacing: 6px; color: #d9c7a4; font-weight: 700; }
  .film .say { color: #f3e2b8; }
  /* B 紀錄片舊照片 */
  .doc { background: #24211d radial-gradient(circle at 50% 35%, #3a342c, #161411 75%); }
  .doc img { position: absolute; left: 50%; top: 38%; width: 84%; transform: translate(-50%, -50%) rotate(-2.2deg); box-shadow: 0 8px 24px #000c; }
  .doc .note { position: absolute; left: 50%; top: 9%; transform: translateX(-50%) rotate(-3deg); font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 18px; color: #1b1a17; background: #e9e0c8; padding: 2px 12px; white-space: nowrap; }
  .doc .sub { position: absolute; left: 18px; right: 18px; top: 70%; font-family: "Noto Serif TC", serif; font-weight: 600; font-size: 17px; line-height: 1.75; color: #efe6d2; }
  .doc .say { color: #f0c987; }
  /* 旁白全文 */
  .script { background: #f3eee4; color: #1a1a1a; border-radius: 6px; padding: 18px 20px; margin-top: 12px; }
  .script h3 { font-size: 20px; font-weight: 900; margin: 18px 0 6px; color: #7a2a1a; }
  .script h3:first-child { margin-top: 0; }
  .script p { font-size: 18px; font-weight: 700; line-height: 1.8; margin: 2px 0; }
  .script .q { color: #8a5a00; }
  .script .why { font-size: 16px; font-weight: 500; color: #555; margin-top: 6px; }
</style></head><body>
<header>
  <h1>背景故事：兩種新風格</h1>
  <p class="lead">兩種風格都用同一套畫面（爸爸出門、發燒的妹妹、排隊提水），也都換上新寫的旁白。每支手機是一個畫面，實際播放時會一句一句淡入。</p>
</header>
<section>
  <h2>A．電影畫面（寫實光影）</h2>
  <p class="lead">全螢幕的寫實畫面，鏡頭慢慢推近；電影調色（暗部偏冷、燈光偏暖）、柔焦與底片顆粒；字幕在下方，就像在看一部戰爭電影的開場。</p>
  <div class="row" id="A"></div>
  <h2>B．紀錄片／舊照片</h2>
  <p class="lead">像戰後整理出來的家庭相片：泛黃的黑白照片、相紙白邊和刮痕，一張一張放在桌上；旁白是哥哥長大後回頭說的話，像紀錄片的口述。</p>
  <div class="row" id="B"></div>
  <h2>新旁白（全文）</h2>
  <p class="lead">兩種風格都用這一版。改寫的方向：少交代事件，多寫「我」記得的小事；讓爸爸、媽媽、妹妹都開口說話；結尾那句和爸爸出門時說的話相同。</p>
  <div class="script" id="S"></div>
</section>
<script>
const SH = [
  { img: 's6', day: '第 22 天', lines: ['爸爸把最後半塊餅乾<br>塞給妹妹，摸了摸我的頭。', '<span class="say">「照顧好妹妹。<br>天亮前，我就回來。」</span>', '我們等到天亮。又等到天黑。<br>爸爸沒有回來。'], show: [0, 1] },
  { img: 's8', day: '第 37 天', lines: ['妹妹燒了一整夜，<br>迷迷糊糊地喊媽媽。', '<span class="say">「哥，媽媽是不是<br>快回來了？」</span>', '我說，快了。'], show: [1, 2] },
  { img: 's2', day: '第 9 天', lines: ['天還沒亮，<br>爸爸就牽著我去排隊。', '他總是把重的那一桶，<br>留給自己。'], show: [0, 1] },
];
for (const [id, cls, pre] of [['A', 'film', 'film_'], ['B', 'doc', 'photo_']]) {
  for (const s of SH) {
    const d = document.createElement('div');
    const txt = s.show.map((i) => s.lines[i]).join('<br>');
    d.innerHTML = cls === 'film'
      ? `<div class="phone film"><img src="${pre}${s.img}.jpg" alt=""><div class="day">${s.day}</div><div class="sub">${txt}</div></div><div class="tag">${s.day}</div>`
      : `<div class="phone doc"><div class="note">${s.day}</div><img src="${pre}${s.img}.jpg" alt=""><div class="sub">${txt}</div></div><div class="tag">${s.day}</div>`;
    document.getElementById(id).appendChild(d);
  }
}
const SC = [
  ['一　被圍', ['港灣市被圍的第一天，媽媽還在廚房煮稀飯。', '爸爸說，過幾天就好了。', '後來，出城的路全被堵死。<br>沒有人進得來，也沒有人出得去。']],
  ['二　水', ['停電以後，是停水。', '天還沒亮，爸爸就牽著我去排隊。<br>他總是把重的那一桶，留給自己。', '米缸見底那天，媽媽把自己那一碗，分成了兩半。']],
  ['三　狙擊手', ['街口的高樓上，有一把槍。', '三樓的陳伯伯，每天都會對妹妹做鬼臉。', '那天，他倒在斑馬線上。<br>那桶水，一路流進了水溝。', '到現在我還是不知道，開槍的是敵人——<br>還是我們自己的人。']],
  ['四　夜裡的人', ['夜裡，常有人踹門。', '有的穿敵人的制服，有的，穿我們的。', '他們拿走隔壁阿姨最後一袋米。<br>她抱著女兒，連哭都不敢出聲。']],
  ['五　爸爸', ['第 22 天。爸爸把最後半塊餅乾塞給妹妹，摸了摸我的頭。', '<span class="q">「照顧好妹妹。天亮前，我就回來。」</span>', '我們等到天亮。又等到天黑。', '爸爸沒有回來。']],
  ['六　媽媽', ['媽媽每天坐在窗邊，看著街口，一句話也不說。', '第五天，她把頭巾綁好，抱了我們很久很久。', '<span class="q">「把門鎖好。除了我，誰來都不要開。」</span>', '她的腳步聲，在樓梯間慢慢變小。', '媽媽也沒有回來。']],
  ['七　今晚', ['第 37 天。媽媽走了，十天。', '妹妹燒了一整夜，迷迷糊糊地喊媽媽。', '<span class="q">「哥，媽媽是不是快回來了？」</span>', '我說，快了。', '家裡沒有藥了。今晚，我得出門。', '天亮前，我一定回來。']],
];
document.getElementById('S').innerHTML = SC.map(([h, ls]) => `<h3>${h}</h3>` + ls.map((l) => `<p>${l}</p>`).join('')).join('');
</script></body></html>
