<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>天亮之前・背景故事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* 天亮之前・背景故事（電影式）：一格一格全螢幕畫面，鏡頭慢慢推移，字幕一句一句出現在下方 */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #f2ede4; font-family: "Noto Sans TC", "PingFang TC", sans-serif; overflow: hidden; }
  #film { position: fixed; inset: 0; }
  /* 畫面：手機直式時佔上方，留下方給字幕；寬螢幕時置中 */
  .shot { position: absolute; left: 0; right: 0; top: 0; height: 72%; overflow: hidden; opacity: 0; transition: opacity 1.4s ease; }
  .shot.on { opacity: 1; }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: var(--o, 50% 50%); transform: scale(1.04) translate(0, 0); }
  .shot.on img { animation: kb var(--d, 10s) linear forwards; }
  @keyframes kb { from { transform: scale(var(--s0, 1.04)) translate(var(--x0, 0), var(--y0, 0)); } to { transform: scale(var(--s1, 1.14)) translate(var(--x1, 0), var(--y1, 0)); } }
  .shot::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 28%; background: linear-gradient(transparent, #000); }
  @media (min-aspect-ratio: 4/5) { .shot { left: 50%; right: auto; width: min(100vw, calc(72vh * 0.75)); transform: translateX(-50%); } }
  #sub { position: fixed; left: 0; right: 0; top: 70%; bottom: 0; display: grid; place-items: start center; padding: 18px 20px 0; }
  .line { grid-area: 1 / 1; max-width: 640px; text-align: center; font-weight: 900; font-size: clamp(21px, 3.1dvh, 28px); line-height: 1.6; opacity: 0; transform: translateY(8px); transition: opacity .9s ease, transform .9s ease; text-wrap: balance; }
  .line.on { opacity: 1; transform: none; }
  .line.say { color: #f3d79a; font-family: "Noto Serif TC", serif; }
  #day { position: fixed; left: 0; right: 0; top: max(14px, env(safe-area-inset-top)); text-align: center; font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 18px; letter-spacing: 8px; color: #e9dcc0; text-shadow: 0 1px 6px #000; opacity: 0; transition: opacity 1.2s; z-index: 2; }
  #day.on { opacity: .95; }
  #skip { position: fixed; right: 12px; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 5; font: 900 16px "Noto Sans TC", sans-serif; color: #f2ede4; background: rgba(0,0,0,.4); border: 2px solid rgba(242,237,228,.6); border-radius: 6px; padding: 8px 14px; }
  #bar { position: fixed; left: 0; bottom: 0; height: 3px; width: 0; background: #b8452e; z-index: 5; }
  #ttl { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; z-index: 6; background: radial-gradient(circle at 50% 40%, #1b1a1d, #000 70%); transition: opacity 1.2s; }
  #ttl h1 { font-family: "Noto Serif TC", serif; font-weight: 900; font-size: clamp(46px, 10vw, 80px); letter-spacing: 10px; margin: 0; }
  #ttl p { font-weight: 700; font-size: 19px; color: #c9bfae; margin: 14px 0 0; }
  #ttl button { margin-top: 34px; font: 900 22px "Noto Sans TC", sans-serif; color: #000; background: #f2ede4; border: 0; border-radius: 6px; padding: 14px 34px; }
  #ttl small { display: block; margin-top: 18px; font-size: 15px; color: #8d8577; font-weight: 700; }
</style></head><body>
<div id="film"></div>
<div id="day"></div>
<div id="sub"></div>
<button id="skip" hidden>跳過 ▶▶</button>
<div id="bar"></div>
<div id="ttl"><div><h1>天亮之前</h1><p>被圍的城裡，一個哥哥的故事</p><button id="go">開始播放</button><small>約 2 分鐘・建議開聲音</small></div></div>
<script>
/* 每一格：圖、秒數、鏡頭移動（起點與終點的縮放與位移、縮放中心）、上方日期、字幕 [出現秒數, 文字, 是否為對白] */
const SHOTS = [
  { img: '02', t: 7, o: '40% 40%', s0: 1.02, s1: 1.12, lines: [[0.6, '港灣市被圍的第一天，<br>媽媽還在廚房煮稀飯。'], [4.0, '爸爸說，過幾天就好了。']] },
  { img: '01', t: 8, o: '50% 70%', s0: 1.15, s1: 1.02, y0: '-2%', y1: '0%', lines: [[0.6, '後來，出城的路全被堵死。'], [4.2, '沒有人進得來，<br>也沒有人出得去。']] },
  { img: '03', t: 12, o: '35% 45%', s0: 1.03, s1: 1.13, x0: '2%', x1: '-2%', lines: [[0.6, '停電以後，是停水。'], [3.4, '天還沒亮，<br>爸爸就牽著我去排隊。'], [6.6, '他總是把重的那一桶，<br>留給自己。'], [9.6, '米缸見底那天，<br>媽媽把自己那一碗，分成兩半。']] },
  { img: '04', t: 8, o: '55% 25%', s0: 1.02, s1: 1.2, lines: [[0.6, '街口的高樓上，有一把槍。'], [4.0, '三樓的陳伯伯，<br>每天都會對妹妹做鬼臉。']] },
  { img: '05', t: 9, o: '30% 55%', s0: 1.12, s1: 1.02, lines: [[0.6, '那天，他倒在斑馬線上。<br>那桶水，一路流進了水溝。'], [4.4, '到現在我還是不知道，<br>開槍的是敵人——'], [6.9, '還是我們自己的人。']] },
  { img: '06', t: 7, o: '50% 30%', s0: 1.02, s1: 1.12, lines: [[0.6, '夜裡，常有人踹門。'], [3.4, '有的穿敵人的制服，<br>有的，穿我們的。']] },
  { img: '07', t: 7, o: '40% 40%', s0: 1.03, s1: 1.13, lines: [[0.6, '他們拿走隔壁阿姨最後一袋米。'], [3.6, '她抱著女兒，<br>連哭都不敢出聲。']] },
  { img: '08', t: 10, o: '45% 45%', s0: 1.02, s1: 1.14, day: '第 22 天', lines: [[0.8, '爸爸把最後半塊餅乾塞給妹妹，<br>摸了摸我的頭。'], [5.0, '「照顧好妹妹。<br>天亮前，我就回來。」', 1]] },
  { img: '09', t: 8, o: '60% 50%', s0: 1.12, s1: 1.02, lines: [[0.6, '我們等到天亮。<br>又等到天黑。'], [4.6, '爸爸沒有回來。']] },
  { img: '10', t: 7, o: '35% 40%', s0: 1.02, s1: 1.12, lines: [[0.6, '媽媽每天坐在窗邊，<br>看著街口，一句話也不說。']] },
  { img: '11', t: 8, o: '50% 40%', s0: 1.02, s1: 1.12, day: '第 27 天', lines: [[0.6, '第五天，她把頭巾綁好，<br>抱了我們很久很久。'], [4.2, '「把門鎖好。除了我，<br>誰來都不要開。」', 1]] },
  { img: '12', t: 8, o: '60% 45%', s0: 1.1, s1: 1.02, lines: [[0.6, '她的腳步聲，<br>在樓梯間慢慢變小。'], [4.4, '媽媽也沒有回來。']] },
  { img: '13', t: 12, o: '35% 45%', s0: 1.02, s1: 1.14, day: '第 37 天', lines: [[0.6, '媽媽走了，十天。'], [3.0, '妹妹燒了一整夜，<br>迷迷糊糊地喊媽媽。'], [6.4, '「哥，媽媽是不是<br>快回來了？」', 1], [9.6, '我說，快了。']] },
  { img: '14', t: 9, o: '50% 35%', s0: 1.02, s1: 1.12, lines: [[0.6, '家裡沒有藥了。<br>今晚，我得出門。'], [4.8, '天亮前，我一定回來。']] },
];
const TOTAL = SHOTS.reduce((a, s) => a + s.t, 0);
const film = document.getElementById('film'), sub = document.getElementById('sub'), day = document.getElementById('day'), bar = document.getElementById('bar');
for (const s of SHOTS) { const i = new Image(); i.src = s.img + '.jpg'; } // 先載入
let timers = [], AC = null, cur = -1;
const later = (s, f) => timers.push(setTimeout(f, s * 1000));
function wind() { try { AC = new (window.AudioContext || window.webkitAudioContext)(); const b = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; const s = AC.createBufferSource(); s.buffer = b; s.loop = true; const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 300; const g = AC.createGain(); g.gain.value = 0.06; s.connect(f).connect(g).connect(AC.destination); s.start(); const o = AC.createOscillator(); o.frequency.value = 55; const g2 = AC.createGain(); g2.gain.value = 0.03; o.connect(g2).connect(AC.destination); o.start(); } catch (e) {} } // 只有風聲和低沉的嗡鳴，沒有爆炸聲
function show(n) {
  cur = n; const S = SHOTS[n];
  const el = document.createElement('div'); el.className = 'shot';
  el.style.cssText = `--d:${S.t + 1.4}s;--o:${S.o};--s0:${S.s0};--s1:${S.s1};--x0:${S.x0 || 0};--x1:${S.x1 || 0};--y0:${S.y0 || 0};--y1:${S.y1 || 0}`;
  el.innerHTML = `<img src="${S.img}.jpg" alt="">`; film.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
  for (const old of [...film.children].slice(0, -1)) { old.classList.remove('on'); setTimeout(() => old.remove(), 1600); }
  if (S.day) { day.textContent = S.day; day.classList.add('on'); later(4.5, () => day.classList.remove('on')); }
  sub.innerHTML = '';
  S.lines.forEach(([at, text, say], i) => { const d = document.createElement('div'); d.className = 'line' + (say ? ' say' : ''); d.innerHTML = text; sub.appendChild(d);
    later(at, () => { [...sub.children].forEach((c) => c.classList.remove('on')); d.classList.add('on'); }); });
  later(S.t - 0.5, () => [...sub.children].forEach((c) => c.classList.remove('on')));
  later(S.t, () => (n + 1 < SHOTS.length ? show(n + 1) : fin()));
}
function fin() {
  timers.forEach(clearTimeout); timers = []; document.getElementById('skip').hidden = true; sub.innerHTML = ''; day.classList.remove('on'); bar.style.transition = 'none'; bar.style.width = '100%';
  const t = document.getElementById('ttl'); t.innerHTML = `<div><h1>天亮之前</h1><p>被圍的第 37 天・晚上</p><button id="go">開始第一關</button></div>`; t.style.opacity = 1; t.hidden = false;
  document.getElementById('go').onclick = () => { location.href = '../?play=1'; };
}
function start() {
  wind(); const t = document.getElementById('ttl'); t.style.opacity = 0; setTimeout(() => (t.hidden = true), 1200);
  document.getElementById('skip').hidden = false; bar.style.transition = `width ${TOTAL}s linear`; requestAnimationFrame(() => (bar.style.width = '100%')); show(0);
}
document.getElementById('go').onclick = start; document.getElementById('skip').onclick = fin;
window.__I = { start, fin, show, SHOTS, TOTAL, clear: () => { timers.forEach(clearTimeout); timers = []; } };
</script>
</body></html>
